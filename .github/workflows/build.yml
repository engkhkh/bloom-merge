# Builds Bloom Merge for every platform on each push to main.
# - Web: published to GitHub Pages
# - Windows: installer + portable .exe (download from the run's "Artifacts")
# - Android: debug .apk you can install on a phone
# Push a tag like v1.0.0 to also create a GitHub Release with the files attached.
name: Build Bloom Merge

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: game

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: game/package-lock.json }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - name: Tests (game rules, codes, dates, translations, every level winnable)
        run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: game/dist }

  deploy-web:
    needs: web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Fails until Pages is turned on (Settings → Pages → Source: GitHub Actions); other builds still finish
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: game/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --x64 --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: bloom-merge-windows
          path: game/release/*.exe

  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: game/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm run build
      - run: npx cap sync android
      - name: Set version
        run: |
          echo "BLOOM_VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          echo "BLOOM_VERSION_CODE=$(( 100 + ${{ github.run_number }} ))" >> "$GITHUB_ENV"
      - name: Debug APK (installable on any phone)
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: game/android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk bloom-merge-android.apk
      # Signed release for Google Play, only when the keystore secrets are set (see game/README.md)
      - name: Signed release (Google Play)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bloom.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/bloom.jks"
          (cd android && ./gradlew bundleRelease assembleRelease --no-daemon)
          cp android/app/build/outputs/bundle/release/app-release.aab bloom-merge-play.aab
          cp android/app/build/outputs/apk/release/app-release.apk bloom-merge-android-release.apk
          rm -f "$RUNNER_TEMP/bloom.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: bloom-merge-android
          path: |
            game/bloom-merge-android.apk
            game/bloom-merge-android-release.apk
            game/bloom-merge-play.aab
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, pattern: 'bloom-merge-*', merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true
